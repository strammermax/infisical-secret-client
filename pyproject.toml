[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infisical-secret-client"
version = "2026.10.31.1"
description = "Small dependency-free client for self-hosted Infisical secrets"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "strammermax"}]

[project.scripts]
infisical-secrets = "infisical_secret_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

